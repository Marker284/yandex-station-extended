// shairport-sync 5.6.2 (своя сборка, AirPlay 2 + MPRIS) для Станции Лайт 2
general = {
  name = "Yandex Lite 2";
  output_backend = "alsa";
  mdns_backend = "avahi";
  airplay_device_id = 0xXXXXXXXXXXXXL; // MAC wlan0 без двоеточий: interface="wlan0" его не даёт
};
sessioncontrol = { allow_session_interruption = "yes"; session_timeout = 60; };
alsa = {
  output_device = "airplay";   // ~/.asoundrc
  output_rate = 48000;         // карта играет только 48 кГц, 44100 принимает молча и дрейфует
  output_format = "S16_LE";
  mixer_control_name = "AirPlay";
};
// MPRIS берёт статус и трек из потока метаданных: без него PlaybackStatus всегда Stopped
metadata = { enabled = "yes"; include_cover_art = "no"; };

[package]
name = "bt-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-util = { version = "0.3", default-features = false }
async-io = "2"
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# lighttpd для веб-пульта Станции: страница /opt/share/remote, CGI /cgi-bin/k
server.modules = ( "mod_cgi" )
server.port = 8080
server.document-root = "/opt/share/remote"
server.pid-file = "/opt/var/run/lighttpd-remote.pid"
server.errorlog = "/opt/var/log/lighttpd-remote.log"
server.upload-dirs = ( "/opt/tmp" )
index-file.names = ( "index.html" )
mimetype.assign = ( ".html" => "text/html; charset=utf-8" )
$HTTP["url"] =~ "^/cgi-bin/" {
    cgi.assign = ( "" => "/system/bin/sh" )
}

# Стандартное определение из alsa.conf: без него softvol не откроет «hw:0»
ctl.hw { @args [ CARD ] @args.CARD { type string default "0" } type hw card $CARD }
pcm.!default { type hw; card 0; device 0 }
ctl.!default { type hw; card 0 }

# Единая громкость: тот же регулятор, который двигает Алиса (set_volume.sh ->
# amixer set Master) — сенсорная панель сразу меняет и громкость AirPlay/Spotify.
# count 1: регулятор у колонки моно, применяется к обоим каналам.
# Диапазон 36 дБ: проценты ложатся на дБ линейно, а на системных 51 дБ четверть
# шкалы — почти тишина и вся громкость сжата в верхнюю половину.
pcm.ap2vol {
    type softvol
    slave.pcm { type hw; card 0; device 0 }
    control { name "Master Playback Volume"; card 0; count 1 }
    resolution 256
    min_dB -36.0
    max_dB 0.0
}

# Приглушение музыки, пока Алиса слушает (voice-spotify.sh и ytmd.py по её состоянию).
# Отдельный регулятор только для AirPlay, Spotify и YouTube: громкость Алисы им не задевается.
pcm.ap2duck {
    type softvol
    slave.pcm "ap2vol"
    control { name "AP2 Duck Playback Volume"; card 0; count 1 }
    resolution 256
    min_dB -30.0
    max_dB 0.0
}

# Оба регулятора на пустой выход: ap2.sh открывает его при старте — так у Master
# появляется шкала в дБ (системный softvol создаёт его без неё, а librespot без шкалы
# микшер не поднимет), а AP2 Duck создаётся до первой команды. Звук никуда не идёт.
pcm.ap2prime {
    type softvol
    slave.pcm {
        type softvol
        slave.pcm { type null }
        control { name "AP2 Duck Playback Volume"; card 0; count 1 }
        resolution 256
        min_dB -30.0
        max_dB 0.0
    }
    control { name "Master Playback Volume"; card 0; count 1 }
    resolution 256
    min_dB -36.0
    max_dB 0.0
}

# plug впереди приводит частоту и формат к тому, что примет железо
pcm.ap2 { type plug; slave.pcm "ap2duck" }
pcm.spotify { type plug; slave.pcm "ap2duck" }
pcm.youtube { type plug; slave.pcm "ap2duck" }

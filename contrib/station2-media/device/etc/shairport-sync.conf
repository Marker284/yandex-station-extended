general = {
    name = "Станция 2";            // как колонка видна в списке AirPlay
    service_type = "airplay2";
    port = 7000;                   // audio-owner.sh ловит сессию по этому порту
    output_backend = "alsa";
    mdns_backend = "avahi";
    session_timeout = 8;           // сколько держать сессию после пропажи источника
};

alsa = {
    output_device = "ap2";         // softvol на регуляторе Master, см. asound.conf
    // Громкость с iPhone/Mac двигает тот же Master, что и сенсорная панель
    mixer_control_name = "Master";
    mixer_device = "default";
    audio_backend_buffer_desired_length_in_seconds = 0.5;
    disable_standby_mode = "auto"; // отпускать устройство в простое
};

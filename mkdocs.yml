site_name: Yandex Station Extended
site_description: Community-вики по модификации и исследованию умных колонок Яндекс (семейство Станций) — доступ, прошивка quasar, железо, рецепты
site_author: Yandex Station Extended community
site_url: https://hackalice.me/
repo_url: https://github.com/Marker284/yandex-station-extended
repo_name: Marker284/yandex-station-extended
edit_uri: edit/main/docs/
copyright: ©2026 YSE contributors. All rights reserved.

theme:
  name: material
  custom_dir: overrides
  language: ru
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Светлая тема
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Тёмная тема

extra:
  # Веб-редактор (editor/): адрес Cloudflare Worker. Пусто — кнопки правки ведут на GitHub.
  editor:
    api: "https://yse-wiki-editor.push-to-claude-worker.workers.dev"
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/hackalice
      name: Чат в Telegram
    - icon: fontawesome/brands/github
      link: https://github.com/Marker284/yandex-station-extended
      name: GitHub

extra_javascript:
  - javascripts/toc-tabs.js
  - javascripts/editor-entry.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/editor-entry.css

# битые ссылки и якоря — ошибка сборки, а не молчаливый INFO
validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: info

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - ru
        - en
  # старые адреса страниц (до реорганизации) продолжают работать
  - redirects:
      redirect_maps:
        platform/access.md: start/root.md
        platform/unbrick.md: start/recovery.md
        packages.md: start/packages.md
        platform/usb-host.md: recipes/usb-host.md
        projects.md: recipes/index.md
        projects/airplay.md: recipes/airplay.md
        projects/custom-sounds.md: recipes/sounds.md
        projects/chatgpt-proxy.md: recipes/llm.md
        platform/subscription-lock.md: recipes/standalone.md
        platform/architecture.md: internals/architecture.md
        platform/network.md: internals/network.md
        platform/quasar-api.md: internals/network.md
        platform/gotchas.md: internals/gotchas.md
        platform/toolchain.md: internals/toolchain.md

# страница редактора не в меню
not_in_nav: |
  /edit.md

nav:
  - Главная: index.md
  - Начало работы:
      - start/index.md
      - Установка ADB на компьютер: start/adb.md
      - 1. Получение root:
          - Большинство моделей — подмена DNS: start/root.md
          - Лайт 2 (Plum) — сертификат из factory: start/retail-ca.md
          - Мини 3 (Bergamot) — сертификат и маркеры: start/retail-ca-mini3.md
          - Станции на Android — AliceBridge: start/root-android.md
          - Станция Макс — доступ через ADB: start/adb-max.md
          - Мини 1 (2019) — ADB по USB: start/root-mini1-usb.md
          - JBL Link Music — ADB по USB: start/root-jbl-link-music.md
      - 2. SSH и обновления: start/ssh.md
      - 3. Пакеты yse: start/packages.md
      - 4. Если что-то сломалось: start/recovery.md
  - Рецепты:
      - recipes/index.md
      - USB Host (OTG): recipes/usb-host.md
      - AirPlay: recipes/airplay.md
      - Плееры как Bluetooth (bt-proxy): recipes/bt-proxy.md
      - Spotify Connect: recipes/spotify.md
      - YouTube Music: recipes/youtube-music.md
      - Свои звуки: recipes/sounds.md
      - Обработанный микрофон: recipes/microphone.md
      - Fastfetch: recipes/fastfetch.md
      - Подсветка: recipes/led.md
      - YAM и BetterYAM: recipes/packagemanagers.md
      - Своя LLM вместо Алисы: recipes/llm.md
      - Колонка без Яндекса: recipes/standalone.md
      - Отключение обновлений (Станция 1): recipes/station1-disable-updates.md
      - ТВ-набор (Станция 1): recipes/station1-tv.md
      - Debian (Станция 1): recipes/station1-debian.md
  - Устройства:
      - devices/index.md
      - Станция Лайт (Micro): devices/station-lite.md
      - Станция Лайт 2 (Plum): devices/station-lite2.md
      - Станция Мини 3 (Bergamot): devices/station-mini3.md
      - Станция Мини 3 Про (Pickle): devices/station-mini3-pro.md
      - Станция 3 (Orion): devices/station-3.md
      - Станция Мини 2: devices/station-mini2.md
      - Станция Мини (1 пок): devices/station-mini.md
      - Станция Миди (Cucumber): devices/station-midi.md
      - Станция 2: devices/station-2.md
      - Станция Стрит (Mango): devices/station-street.md
      - Станция Макс: devices/station-max.md
      - Станция Макс с Zigbee: devices/station-max-zigbee.md
      - Станция (1 поколения): devices/station-gen1.md
      - Умный хаб (Saturn): devices/yandex-hub.md
      - JBL Link Music: devices/jbl-link-music.md
  - Как это устроено:
      - Архитектура прошивки: internals/architecture.md
      - Сеть и порты: internals/network.md
      - Звонки Алисы (порт 5081): internals/calls.md
      - Голосовой тракт Алисы: internals/voice.md
      - Телеметрия: internals/telemetry.md
      - Директивы и capabilities: internals/directives.md
      - Подводные камни: internals/gotchas.md
      - Сборка софта: internals/toolchain.md
  - Словарь: glossary.md
  - Как дополнять вики: contributing.md
  - Участники: contributors.md
